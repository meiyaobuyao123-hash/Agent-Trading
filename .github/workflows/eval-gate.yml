# Eval Gate — 任何 PR / push 自动跑 9 eval suite + self-tests
#
# 引用 docs/runbook/eval-runbook.md §5(CI 集成示例)
# 引用 docs/agent-pm/eval-summary.md(Phase 4 sign-off)
#
# Hard gate:任一 hard suite(L1/L2/L3/L4/Safety/Judge)失败 → CI fail
# Soft gate:launch_criteria(milestone-gated)/ quality_rubric(LLM-judge target)
#           不阻塞 PR;通过 nightly job 监控趋势
#
# 跳过 launch_criteria 是开发期默认做法(17 blocked 都是 GA milestone-gated)。
# nightly 跑全部 9 + 上传 JSON 让 dashboard 跟踪 launch 推进。

name: Eval Gate

on:
  pull_request:
    branches: [main, agent-v1]
    paths:
      - 'services/pump-scanner/agent/**'
      - 'services/pump-scanner/api/**'
      - 'services/pump-scanner/prompts/**'
      - 'services/pump-scanner/migrations/**'
      - 'services/pump-scanner/main.py'
      - 'services/pump-scanner/requirements.txt'
      - 'services/pump-scanner/tests/**'
      - '.github/workflows/eval-gate.yml'
  push:
    branches: [main, agent-v1]
  schedule:
    - cron: '0 16 * * *'  # UTC 16:00 = 北京 00:00 nightly(跑全 9 含 launch)
  workflow_dispatch: {}    # 手动触发

permissions:
  contents: read
  pull-requests: write     # 给 PR 评论写权限(CI bot 留 eval summary)

jobs:
  eval:
    name: 9 suite eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/pump-scanner/requirements.txt

      - name: Install minimal eval deps
        # 不装全 requirements.txt(避免 supabase/anthropic/firebase 等无 key 的 import 报错)
        # 只装 eval 框架自身需要的:pytest + pytest-asyncio + PyYAML + jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio PyYAML jsonschema pydantic

      - name: Determine skip_launch (PR=skip / nightly+push=full)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "skip_arg=" >> $GITHUB_OUTPUT
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "skip_arg=--skip launch_criteria" >> $GITHUB_OUTPUT
            echo "mode=pr-skip-launch" >> $GITHUB_OUTPUT
          fi

      - name: Run 9 suite eval (${{ steps.mode.outputs.mode }})
        id: eval
        working-directory: services/pump-scanner
        run: |
          set +e
          python -m agent.eval.run_all ${{ steps.mode.outputs.skip_arg }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          # JSON snapshot for artifact
          python -m agent.eval.run_all --json ${{ steps.mode.outputs.skip_arg }} > /tmp/eval-snapshot.json || true

      - name: Run eval framework self-tests
        working-directory: services/pump-scanner
        run: |
          python -m pytest \
            tests/test_eval_runner.py \
            tests/test_eval_skill_runner.py \
            tests/test_eval_prompt_runner.py \
            tests/test_eval_chain_runner.py \
            tests/test_eval_safety_runner.py \
            tests/test_eval_trajectory_runner.py \
            tests/test_eval_launch_runner.py \
            tests/test_eval_rubric_runner.py \
            tests/test_eval_judge_runner.py \
            tests/test_eval_run_all.py \
            tests/test_input_filter.py \
            tests/test_rollout_gate.py \
            tests/test_rollout_gate_integration.py \
            tests/test_tools_t01_t02_t03_t08.py \
            -q --tb=line

      - name: Upload eval JSON snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-snapshot-${{ github.run_id }}
          path: /tmp/eval-snapshot.json
          retention-days: 30

      - name: Comment PR with eval summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🤖 Eval Gate Result\n\n';
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/eval-snapshot.json', 'utf8'));
              const ok = data.all_hard_gates_passed ? '✅ all hard gates passed' : '❌ HARD GATE FAILED';
              body += `**${ok}** — ${data.total_passed}/${data.total_cases} cases in ${data.total_duration_s}s\n\n`;
              body += '| suite | pass | rate | hard_gate | notes |\n|---|---|---|---|---|\n';
              for (const s of data.suites) {
                const gate = s.hard_gate_passed ? '✓' : (s.hard_gate ? '❌' : '—');
                const note = s.error ? `⚠ ${s.error}` : (s.extra.passes !== undefined ? (s.extra.passes ? 'passes' : 'FAIL') : (s.extra.all_severities_meet_threshold !== undefined ? (s.extra.all_severities_meet_threshold ? 'severity ✓' : 'severity ✗') : ''));
                body += `| \`${s.name}\` | ${s.passed}/${s.total} | ${(s.pass_rate*100).toFixed(1)}% | ${gate} | ${note} |\n`;
              }
              body += '\n_See `docs/runbook/eval-runbook.md` for triage._';
            } catch (e) {
              body += `❌ Failed to parse eval snapshot: ${e.message}`;
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Fail job if hard gate failed
        if: steps.eval.outputs.exit_code != '0'
        run: |
          echo "::error::Eval hard gate failed (exit code ${{ steps.eval.outputs.exit_code }})"
          echo "See artifact eval-snapshot for details, and docs/runbook/eval-runbook.md for triage"
          exit 1
