name: aitrading_app
description: "pump.fun 内盘信号 — 每日推送最具潜力早期代币"
publish_to: 'none'

version: 1.2.0+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase SDK 已移除 — 全部走后端 HTTP API

  # 工具
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.0

  # 图片缓存
  cached_network_image: ^3.4.1

  # 本地存储
  shared_preferences: ^2.3.5

  # 安全存储（私钥/助记词使用 iOS Keychain / Android Keystore）
  flutter_secure_storage: ^9.0.0

  # HTTP 客户端
  http: ^1.2.0

  # K线图 (TradingView via WebView)
  webview_flutter: ^4.13.0

  # 加载骨架屏
  shimmer: ^3.0.0

  # Firebase 推送通知
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

  # R47 — 充值二维码
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
