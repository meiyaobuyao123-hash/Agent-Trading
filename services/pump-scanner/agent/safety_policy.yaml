    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR13
    name: 持有人 < 50 禁交易
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR14
    name: Top10 集中度 > 80% 禁交易
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR15
    name: 24h 跌 > 40% 禁买入(逆势保护)
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR16
    name: Regime = CRISIS 禁所有买入
    severity: BLOCK
    implemented: true
    check:
      type: compound
      op: AND
      items:
        - type: simple
          field: regime
          op: eq
          value: CRISIS
        - type: simple
          field: action
          op: eq
          value: buy
    message: "市场 Regime=CRISIS 禁止买入"

  - id: HR17
