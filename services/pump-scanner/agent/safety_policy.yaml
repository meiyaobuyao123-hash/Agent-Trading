# ============================================================
# Circuit Breakers (CB01-CB13)
# ============================================================
# 触发后整个 Agent 进入 BLOCKED 状态;只能 admin 解除或 60min 自动恢复
circuit_breakers:
  - id: CB01
    name: 日亏损熔断(>$500)
    auto_release_after_min: 1440  # 24h 后才能解除
    todo: TODO

  - id: CB02
    name: 周亏损熔断(>$1500)
    auto_release_after_min: 10080  # 7d
    todo: TODO

  - id: CB03
    name: 连亏 3 笔熔断
    auto_release_after_min: 60
    todo: TODO

  - id: CB04
    name: LLM 月预算超限熔断
    auto_release_after_min: null  # 仅月初自动恢复 / 超 150% 永久 BLOCKED 待人工
    todo: TODO

  - id: CB05
    name: 最大回撤熔断
    auto_release_after_min: 1440
    todo: TODO

  - id: CB06
    name: API 错误率 > 50% 熔断(数据源整体降级)
    auto_release_after_min: 10
    todo: TODO

  - id: CB07
    name: 单代币重复触发 ≥ 5 次/小时熔断
    auto_release_after_min: 60
    todo: TODO

  - id: CB08
    name: HITL 队列超时累积熔断(> 20 条 expired)
    auto_release_after_min: 60
    todo: TODO

  - id: CB09
    name: Memory WAL 失败累积熔断(retry queue > 50 条)
    auto_release_after_min: null
    todo: TODO

  - id: CB10
    name: Eval 通过率跌破门槛熔断
    auto_release_after_min: null
    todo: TODO

  - id: CB11
    name: copy_trade 目标钱包 24h 亏 > 30% 自动 mute
    auto_release_after_min: 1440
    todo: TODO

  - id: CB12
    name: KMS 不可用熔断(关键路径阻塞)
    auto_release_after_min: 10
    todo: TODO

  - id: CB13
    name: Regime CRISIS 触发(BTC 10min 跌 > 3%)
