# Safety Policy v0.2
# 引用 docs/agent-pm/08-safety-policy.md
# 引用 docs/agent-pm/17-tech-plan.md Phase 0
#
# check 字段结构化(机器可读,safety_engine.py 直接 eval):
#   type: simple    field/op/value 单字段比较
#   type: compound  op=AND|OR + items[] 嵌套
#   type: boolean   field 直接读 bool
#   type: regex     field/pattern/flags 文本匹配
#   type: function  fn(ctx) → bool(预留扩展点,Python 函数注册到 safety_engine)
#
# op 支持: gt/gte/lt/lte/eq/ne/in/not_in/contains/starts_with
#
# 加载失败 fail-safe → CB12 触发,整个 Agent BLOCKED
# 由 agent/safety_engine.py runtime check
#
# 状态:🟢 v0.2(10 核心 HR + 5 C 完整实施;其余 20 HR 占位 TODO)

version: v0.2
status: partial_implemented
last_modified: "2026-05-01"
owner: security-lead
implemented_count:
  hard_rules: 10            # HR01 HR02 HR04 HR07 HR09 HR16 HR21 HR22 HR25 HR28
  circuit_breakers: 0       # W3 D2 实施
  constitutional: 5

# ============================================================
# Hard Red Lines (HR01-HR30)
# ============================================================
hard_rules:

  - id: HR01
    name: 单笔真金 ≤ $500
    severity: BLOCK
    implemented: true
    check:
      type: simple
      field: amount_usd
      op: gt
      value: 500
    message: "单笔金额 ${amount_usd} 超过 $500 上限"
    audit_event: trade_exec

  - id: HR02
    name: 日累计真金 ≤ $2000
    severity: BLOCK
    implemented: true
    check:
      type: simple
      field: daily_total_usd
      op: gt
      value: 2000
    message: "日累计 ${daily_total_usd} 超过 $2000 上限"
    audit_event: trade_exec

  - id: HR03
    name: 月累计真金 ≤ $20000
    severity: BLOCK
    implemented: false
    todo: W3 D2 实施

  - id: HR04
    name: 单策略持仓 ≤ 总余额 10%
    severity: BLOCK
    implemented: true
    check:
      type: simple
      field: strategy_position_pct
      op: gt
      value: 0.10
    message: "策略持仓 ${strategy_position_pct} 超过总余额 10%"

  - id: HR05
    name: 同链集中度 ≤ 50%
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR06
    name: 持仓代币数 ≤ 20
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR07
    name: 流动性 < $10K 禁交易
    severity: BLOCK
    implemented: true
    check:
      type: simple
      field: liquidity_usd
      op: lt
      value: 10000
    message: "代币流动性 ${liquidity_usd} 低于 $10K"

  - id: HR08
    name: 买/卖税 > 10% 禁交易
    severity: BLOCK
    implemented: false
    todo: TODO

  - id: HR09
